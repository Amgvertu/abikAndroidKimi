plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'info.prorabka.abik.android'
    compileSdk 35

    // Общий keystore для debug-сборок: одинаковый отпечаток подписи
    // на всех компьютерах разработки (важно для FCM/RuStore/Huawei).
    // Файл keystore/abik-debug.keystore лежит в проекте — не удалять.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/abik-debug.keystore')
            storePassword 'android'
            keyAlias 'abikdebug'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "info.prorabka.abik.android"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Полный API-префикс зашит в base URL: и прод, и локальный сервер используют
        // context-path /api/abik (см. application-prod.yml). Nginx на varamy.online
        // проксирует /api/abik/ на бэкенд без переписывания пути.
        // new String(...) — намеренно: обычная строковая константа инлайнится
        // компилятором в места использования, и gradle build cache потом тащит
        // СТАРОЕ значение даже после clean (поймано на живом инциденте).
        buildConfigField "String", "DEFAULT_BASE_URL", 'new String("https://varamy.online/api/abik/")'
        buildConfigField "String", "LOCAL_BASE_URL", 'new String("http://192.168.0.119:8083/api/abik/")'

        // Project ID из консоли RuStore (console.rustore.ru → проект → Push).
        // Пока пусто — RuStore Push не инициализируется. Когда зарегистрируете
        // проект в RuStore, впишите ID сюда.
        buildConfigField "String", "RUSTORE_PROJECT_ID", 'new String("3hXUg4XY1qsSRn0Gshfr3k28EoKtWlc9")'
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'com.google.dagger:hilt-android:2.51.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.51.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'

    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // RuStore Push SDK (репозиторий VK) — требует project ID в BuildConfig.RUSTORE_PROJECT_ID
    implementation 'ru.rustore.sdk:pushclient:7.5.0'

    // Huawei HMS Push: agconnect-core читает agconnect-services.json (когда появится в app/),
    // push — получение токена и приём сообщений
    implementation 'com.huawei.agconnect:agconnect-core:1.9.1.300'
    implementation 'com.huawei.hms:push:6.11.0.300'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}
